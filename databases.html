<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="WKMS Weather Lab Research Center for sixth grade meteorological inquiry.">

<title>Research Center | WKMS Weather Lab</title>

<style>

/* ============================================================
   WKMS WEATHER LAB — STATION 02
   RESEARCH CENTER / DATABASE NETWORK
   WEATHER PATTERN: RAINSTORM
   ============================================================ */

:root {
  --night: #020b14;
  --deep: #041523;
  --storm: #09263b;
  --panel: #0a2b42;
  --panel2: #103c56;

  --sky: #72dcff;
  --sky2: #c5f2ff;
  --green: #68e3bb;
  --amber: #ffd166;

  --white: #f7fcff;
  --soft: #d1e1ea;
  --muted: #9db6c4;

  --line: rgba(114,220,255,.23);
}


/* ============================================================
   RESET
   ============================================================ */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;

  color: var(--white);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  line-height: 1.6;

  background:
    linear-gradient(
      180deg,
      #061827 0%,
      #041421 45%,
      #020c15 100%
    );
}

a {
  color: inherit;
}

button,
input {
  font: inherit;
}

a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 4px solid var(--amber);
  outline-offset: 4px;
}


/* ============================================================
   ACCESSIBILITY
   ============================================================ */

.skip-link {
  position: fixed;
  top: -100px;
  left: 20px;

  z-index: 99999;

  padding: 12px 18px;

  color: #00131f;
  background: var(--amber);

  border-radius: 0 0 8px 8px;

  font-weight: 900;
  text-decoration: none;
}

.skip-link:focus {
  top: 0;
}


/* ============================================================
   PAGE
   ============================================================ */

.site {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
}

.site::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 0;
  pointer-events: none;

  opacity: .08;

  background-image:
    linear-gradient(
      rgba(114,220,255,.15) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(114,220,255,.15) 1px,
      transparent 1px
    );

  background-size: 55px 55px;
}


/* ============================================================
   STORM SKY
   ============================================================ */

.storm-sky {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 780px;

  z-index: 1;

  overflow: hidden;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 78% 20%,
      rgba(113,170,201,.15),
      transparent 28%
    ),

    linear-gradient(
      180deg,
      rgba(18,45,62,.25),
      transparent
    );
}


/* ============================================================
   STORM CLOUDS
   ============================================================ */

.storm-cloud {
  position: absolute;

  width: 340px;
  height: 90px;

  left: -450px;

  border-radius: 100px;

  background:
    linear-gradient(
      180deg,
      rgba(125,151,166,.82),
      rgba(53,77,93,.72)
    );

  filter:
    drop-shadow(
      0 22px 25px
      rgba(0,0,0,.3)
    );

  animation:
    stormDrift
    45s
    linear
    infinite;
}

.storm-cloud::before,
.storm-cloud::after {
  content: "";

  position: absolute;

  border-radius: 50%;

  background: inherit;
}

.storm-cloud::before {
  width: 145px;
  height: 145px;

  left: 55px;
  bottom: 15px;
}

.storm-cloud::after {
  width: 175px;
  height: 175px;

  right: 42px;
  bottom: 6px;
}

.cloud-a {
  top: 105px;

  opacity: .45;
}

.cloud-b {
  top: 230px;

  opacity: .25;

  transform: scale(1.35);

  animation-duration: 65s;
  animation-delay: 9s;
}

.cloud-c {
  top: 390px;

  opacity: .2;

  transform: scale(.75);

  animation-duration: 53s;
  animation-delay: 20s;
}


/* ============================================================
   RAIN
   ============================================================ */

.rain {
  position: absolute;
  inset: 0;

  overflow: hidden;

  opacity: .42;
}

.drop {
  position: absolute;

  top: -100px;

  width: 2px;
  height: 85px;

  background:
    linear-gradient(
      transparent,
      rgba(175,229,255,.7)
    );

  transform:
    rotate(11deg);

  animation:
    rainfall
    1.3s
    linear
    infinite;
}

.drop:nth-child(1) {
  left: 4%;
  animation-delay: .1s;
}

.drop:nth-child(2) {
  left: 12%;
  animation-delay: .7s;
}

.drop:nth-child(3) {
  left: 21%;
  animation-delay: .3s;
}

.drop:nth-child(4) {
  left: 30%;
  animation-delay: 1s;
}

.drop:nth-child(5) {
  left: 39%;
  animation-delay: .5s;
}

.drop:nth-child(6) {
  left: 48%;
  animation-delay: .2s;
}

.drop:nth-child(7) {
  left: 57%;
  animation-delay: .85s;
}

.drop:nth-child(8) {
  left: 66%;
  animation-delay: .4s;
}

.drop:nth-child(9) {
  left: 75%;
  animation-delay: 1.1s;
}

.drop:nth-child(10) {
  left: 84%;
  animation-delay: .65s;
}

.drop:nth-child(11) {
  left: 92%;
  animation-delay: .25s;
}

.drop:nth-child(12) {
  left: 97%;
  animation-delay: .9s;
}


/* ============================================================
   DISTANT LIGHTNING
   ============================================================ */

.lightning {
  position: absolute;
  inset: 0;

  opacity: 0;

  background:
    radial-gradient(
      circle at 77% 20%,
      rgba(205,241,255,.24),
      transparent 28%
    );

  animation:
    lightningFlash
    11s
    infinite;
}


/* ============================================================
   WRAPPER
   ============================================================ */

.wrapper {
  position: relative;

  z-index: 3;

  width: 100%;

  padding:
    25px
    clamp(20px, 5vw, 90px)
    70px;
}


/* ============================================================
   TOP NAV
   ============================================================ */

.topbar {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 20px;

  flex-wrap: wrap;

  padding-bottom: 15px;

  border-bottom:
    1px solid
    rgba(255,255,255,.15);
}

.breadcrumb {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  color: var(--sky);

  font-size: .7rem;
  font-weight: 900;

  letter-spacing: 1.7px;
}

.breadcrumb a {
  text-decoration: none;
}

.breadcrumb a:hover {
  text-decoration: underline;
}

.controls {
  display: flex;
  gap: 8px;
}

.control {
  min-height: 44px;

  padding: 9px 14px;

  color: var(--white);

  cursor: pointer;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(114,220,255,.26);

  border-radius: 8px;

  font-weight: 800;
}

.control:hover {
  background:
    rgba(114,220,255,.13);
}


/* ============================================================
   HERO
   ============================================================ */

.hero {
  display: grid;

  grid-template-columns:
    minmax(0, 1.35fr)
    minmax(280px, .65fr);

  gap: 50px;

  align-items: center;

  min-height: 590px;

  padding:
    70px
    0;
}

.station {
  margin-bottom: 12px;

  color: var(--sky);

  font-size: .72rem;
  font-weight: 900;

  letter-spacing: 3px;
}

.hero h1 {
  margin: 0;

  font-size:
    clamp(
      4rem,
      9vw,
      8rem
    );

  line-height: .82;

  letter-spacing: -5px;

  text-transform: uppercase;
}

.hero h1 span {
  color: var(--sky2);
}

.hero-copy {
  max-width: 720px;

  margin:
    27px
    0
    0;

  color: var(--soft);

  font-size:
    clamp(
      1rem,
      2vw,
      1.35rem
    );
}


/* ============================================================
   NETWORK TERMINAL
   ============================================================ */

.network-terminal {
  position: relative;

  overflow: hidden;

  max-width: 410px;

  margin-left: auto;

  padding:
    27px;

  background:
    rgba(2,14,24,.88);

  border:
    1px solid
    rgba(104,227,187,.42);

  border-radius: 10px;

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.35),

    inset 0 0 30px
    rgba(104,227,187,.03);
}

.network-terminal::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;

  height: 65px;

  top: -80px;

  background:
    linear-gradient(
      transparent,
      rgba(104,227,187,.06),
      transparent
    );

  animation:
    terminalScan
    5s
    linear
    infinite;
}

.terminal-code {
  color: var(--green);

  font-family:
    "Courier New",
    monospace;

  font-size: .67rem;
  font-weight: 900;

  letter-spacing: 1.5px;
}

.network-terminal h2 {
  margin:
    20px
    0
    18px;

  font-family:
    "Courier New",
    monospace;

  font-size:
    clamp(
      1.5rem,
      3vw,
      2.1rem
    );

  line-height: 1.15;
}

.status-row {
  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding:
    9px
    0;

  border-top:
    1px solid
    rgba(255,255,255,.1);

  font-family:
    "Courier New",
    monospace;

  font-size: .72rem;
}

.status-row span:first-child {
  color: var(--muted);
}

.status-online {
  color: var(--green);

  font-weight: 900;
}


/* ============================================================
   QUICK NAV
   ============================================================ */

.quick-nav {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 60px;
}

.quick-nav a {
  padding:
    10px
    14px;

  color: var(--sky2);

  background:
    rgba(114,220,255,.06);

  border:
    1px solid
    rgba(114,220,255,.2);

  border-radius: 100px;

  font-size: .68rem;
  font-weight: 900;

  letter-spacing: 1px;

  text-decoration: none;

  transition:
    transform .2s ease,
    background .2s ease;
}

.quick-nav a:hover {
  transform:
    translateY(-2px);

  background:
    rgba(114,220,255,.14);
}


/* ============================================================
   SECTION HEADER
   ============================================================ */

.section-header {
  margin:
    75px
    0
    28px;
}

.section-code {
  color: var(--sky);

  font-size: .67rem;
  font-weight: 900;

  letter-spacing: 2px;
}

.section-header h2 {
  margin:
    5px
    0
    8px;

  font-size:
    clamp(
      2rem,
      4vw,
      3.3rem
    );

  line-height: 1.1;
}

.section-header p {
  max-width: 820px;

  margin: 0;

  color: var(--muted);
}


/* ============================================================
   DATABASE GRID
   ============================================================ */

.database-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap: 18px;
}

.database {
  position: relative;

  display: flex;
  flex-direction: column;

  min-height: 430px;

  overflow: hidden;

  padding:
    27px;

  background:
    linear-gradient(
      145deg,
      rgba(13,49,73,.98),
      rgba(3,19,32,.99)
    );

  border:
    1px solid
    rgba(114,220,255,.22);

  border-radius: 13px;

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.database:hover {
  transform:
    translateY(-8px);

  border-color:
    var(--sky);

  box-shadow:
    0 20px 40px
    rgba(0,0,0,.32);
}

.database-number {
  position: absolute;

  top: -23px;
  right: 10px;

  color:
    rgba(114,220,255,.06);

  font-size: 8rem;
  font-weight: 900;

  line-height: 1;
}

.database-label {
  position: relative;

  z-index: 2;

  color: var(--green);

  font-size: .62rem;
  font-weight: 900;

  letter-spacing: 1.7px;
}

.database h3 {
  position: relative;

  z-index: 2;

  margin:
    18px
    0
    5px;

  font-size: 1.5rem;
}

.access {
  position: relative;

  z-index: 2;

  margin-bottom: 20px;

  color: var(--sky2);

  font-size: .72rem;
  font-weight: 800;
}

.database p {
  position: relative;

  z-index: 2;

  margin:
    0
    0
    20px;

  color: var(--muted);

  font-size: .87rem;
}

.database-info {
  position: relative;

  z-index: 2;

  margin-top: auto;

  padding-top: 15px;

  border-top:
    1px solid
    rgba(255,255,255,.11);
}

.database-info strong {
  display: block;

  margin-bottom: 5px;

  color: var(--amber);

  font-size: .62rem;

  letter-spacing: 1.2px;
}

.search-example {
  display: block;

  margin-top: 6px;

  padding:
    8px
    10px;

  color: var(--green);

  background:
    rgba(0,0,0,.22);

  border-radius: 5px;

  font-family:
    "Courier New",
    monospace;

  font-size: .72rem;
}

.placeholder {
  border-style: dashed;
}


/* ============================================================
   SEARCH LAB
   ============================================================ */

.search-lab {
  position: relative;

  overflow: hidden;

  padding:
    clamp(
      27px,
      5vw,
      48px
    );

  background:
    linear-gradient(
      135deg,
      rgba(10,43,66,.98),
      rgba(3,19,32,.99)
    );

  border:
    1px solid
    rgba(104,227,187,.28);

  border-radius: 16px;
}

.search-lab::after {
  content: "SEARCH";

  position: absolute;

  right: -20px;
  bottom: -45px;

  color:
    rgba(104,227,187,.035);

  font-size:
    clamp(
      6rem,
      16vw,
      13rem
    );

  font-weight: 900;

  line-height: 1;
}

.search-steps {
  position: relative;

  z-index: 2;

  display: grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap: 14px;

  margin-top: 28px;
}

.search-step {
  padding:
    20px;

  background:
    rgba(255,255,255,.04);

  border-top:
    3px solid
    var(--green);

  border-radius: 6px;
}

.step-number {
  color: var(--green);

  font-family:
    "Courier New",
    monospace;

  font-size: .7rem;
  font-weight: 900;
}

.search-step h3 {
  margin:
    8px
    0;

  font-size: 1rem;
}

.search-step p {
  margin: 0;

  color: var(--muted);

  font-size: .82rem;
}


/* ============================================================
   INTERACTIVE QUERY BUILDER
   ============================================================ */

.query-builder {
  position: relative;

  z-index: 2;

  margin-top: 35px;

  padding:
    25px;

  background:
    rgba(0,0,0,.22);

  border:
    1px solid
    rgba(114,220,255,.16);

  border-radius: 10px;
}

.query-builder label {
  display: block;

  margin-bottom: 8px;

  color: var(--sky2);

  font-size: .72rem;
  font-weight: 900;

  letter-spacing: 1px;
}

.query-row {
  display: grid;

  grid-template-columns:
    1fr
    1fr
    auto;

  gap: 10px;
}

.query-row input {
  min-width: 0;

  padding:
    12px;

  color: var(--white);

  background:
    #041725;

  border:
    1px solid
    rgba(114,220,255,.28);

  border-radius: 6px;
}

.query-row input::placeholder {
  color: #7893a3;
}

.build-button {
  padding:
    10px
    18px;

  color: #00141f;

  cursor: pointer;

  background: var(--green);

  border: 0;
  border-radius: 6px;

  font-weight: 900;
}

.build-button:hover {
  filter: brightness(1.08);
}

.query-output {
  min-height: 52px;

  margin-top: 15px;

  padding:
    13px;

  color: var(--green);

  background: #020e17;

  border-left:
    4px solid
    var(--green);

  border-radius: 4px;

  font-family:
    "Courier New",
    monospace;

  font-size: .82rem;
}


/* ============================================================
   SOURCE CHECK
   ============================================================ */

.source-check {
  display: grid;

  grid-template-columns:
    repeat(
      5,
      minmax(0,1fr)
    );

  gap: 12px;
}

.check {
  min-height: 190px;

  padding:
    20px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(114,220,255,.18);

  border-radius: 10px;
}

.check-letter {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 39px;
  height: 39px;

  margin-bottom: 17px;

  color: #00131f;
  background: var(--sky);

  border-radius: 50%;

  font-weight: 900;
}

.check h3 {
  margin:
    0
    0
    7px;

  font-size: .95rem;
}

.check p {
  margin: 0;

  color: var(--muted);

  font-size: .79rem;
}


/* ============================================================
   RESEARCH ALERT
   ============================================================ */

.research-alert {
  display: grid;

  grid-template-columns:
    auto
    1fr;

  gap: 25px;

  align-items: center;

  margin-top: 70px;

  padding:
    30px;

  background:
    rgba(255,209,102,.07);

  border:
    1px solid
    rgba(255,209,102,.3);

  border-radius: 14px;
}

.alert-mark {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 70px;
  height: 70px;

  color: #07131e;
  background: var(--amber);

  border-radius: 50%;

  font-size: 1.2rem;
  font-weight: 900;
}

.alert-content span {
  color: var(--amber);

  font-size: .65rem;
  font-weight: 900;

  letter-spacing: 1.7px;
}

.alert-content h2 {
  margin:
    3px
    0
    5px;

  font-size: 1.4rem;
}

.alert-content p {
  margin: 0;

  color: var(--muted);
}


/* ============================================================
   RETURN
   ============================================================ */

.return-area {
  margin-top: 65px;

  text-align: center;
}

.return-button {
  display: inline-block;

  padding:
    12px
    18px;

  color: #00131f;
  background: var(--sky);

  border-radius: 7px;

  font-size: .72rem;
  font-weight: 900;

  letter-spacing: 1.3px;

  text-decoration: none;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.return-button:hover {
  transform:
    translateY(-3px);

  box-shadow:
    0 12px 25px
    rgba(114,220,255,.2);
}


/* ============================================================
   FOOTER
   ============================================================ */

footer {
  display: flex;

  justify-content: space-between;

  gap: 15px;

  flex-wrap: wrap;

  margin-top: 60px;

  padding-top: 20px;

  color: #7f99a8;

  border-top:
    1px solid
    rgba(255,255,255,.1);

  font-size: .65rem;
  font-weight: 800;

  letter-spacing: 1.2px;
}


/* ============================================================
   READING MODE
   ============================================================ */

body.reading-mode {
  font-size: 118%;

  background: #071827;
}

body.reading-mode .storm-sky,
body.reading-mode .site::after {
  display: none;
}

body.reading-mode p {
  line-height: 1.9;
}

body.reading-mode .hero h1 {
  letter-spacing: -2px;
}


/* ============================================================
   PAUSE MOTION
   ============================================================ */

body.motion-paused *,
body.motion-paused *::before,
body.motion-paused *::after {
  animation-play-state:
    paused !important;

  transition:
    none !important;
}


/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes stormDrift {

  from {
    left: -500px;
  }

  to {
    left: calc(100% + 500px);
  }

}


@keyframes rainfall {

  from {
    transform:
      translateY(-120px)
      translateX(0)
      rotate(11deg);
  }

  to {
    transform:
      translateY(900px)
      translateX(-120px)
      rotate(11deg);
  }

}


@keyframes lightningFlash {

  0%,
  87%,
  91%,
  100% {
    opacity: 0;
  }

  88% {
    opacity: .6;
  }

  89% {
    opacity: .08;
  }

  90% {
    opacity: .35;
  }

}


@keyframes terminalScan {

  from {
    top: -80px;
  }

  to {
    top: 110%;
  }

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 1000px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .network-terminal {
    max-width: 600px;

    margin:
      0
      auto;
  }

  .database-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .search-steps {
    grid-template-columns:
      repeat(
        2,
        1fr
      );
  }

  .source-check {
    grid-template-columns:
      repeat(
        2,
        1fr
      );
  }

}


@media (max-width: 650px) {

  .wrapper {
    padding:
      20px
      18px
      50px;
  }

  .hero {
    min-height: auto;

    padding:
